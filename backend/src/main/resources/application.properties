spring.application.name=hotel-management
server.port=54321

# MySQL - Hotel data
spring.datasource.mysql.jdbc-url=${MYSQL_URL:jdbc:mysql://localhost:3306/student_db}
spring.datasource.mysql.username=${MYSQL_USER:root}
spring.datasource.mysql.password=${MYSQL_PASSWORD:}

# PostgreSQL - AI/RAG (now live on Oracle VM)
spring.datasource.postgres.jdbc-url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/vector_db}
spring.datasource.postgres.username=${POSTGRES_USER:postgres}
spring.datasource.postgres.password=${POSTGRES_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text

huggingface.api.key=${HF_API_KEY}