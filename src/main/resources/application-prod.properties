spring.application.name=hotel-management
server.port=8080

# MySQL - Hotel data
spring.datasource.mysql.jdbc-url=${MYSQL_URL}
spring.datasource.mysql.username=${MYSQL_USER}
spring.datasource.mysql.password=${MYSQL_PASSWORD}

# PostgreSQL - AI/RAG data
spring.datasource.postgres.jdbc-url=${POSTGRES_URL}
spring.datasource.postgres.username=${POSTGRES_USER}
spring.datasource.postgres.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jackson.deserialization.fail-on-unknown-properties=false

# JWT
jwt.secret=${JWT_SECRET}

# Ollama (will use env var if set, otherwise localhost)
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.embedding.options.model=nomic-embed-text
